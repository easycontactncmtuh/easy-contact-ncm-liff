<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Easy Contact NCM</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>

<body>

  <h2>Easy Contact NCM</h2>
  <p id="status">Initializing LIFF...</p>
  <div id="consultDetail" style="display:none;">
  <p><strong>เรื่องที่ส่งปรึกษา</strong></p>
  <p id="consultContent"></p>
</div>
<button id="ackButton" style="display:none;">
  รับ Consult
</button>

<p id="ackStatus"></p>
  <button id="assessButton" style="display:none;">
  ประเมินผู้ป่วยแล้ว
</button>

<p id="assessStatus"></p>
  <script>
    const LIFF_ID = "2011629396-n8tvniQM";

    async function initializeLIFF() {
      const status = document.getElementById("status");

      try {
        await liff.init({
          liffId: LIFF_ID,
          withLoginOnExternalBrowser: true
        });

        if (!liff.isLoggedIn()) {
  status.textContent = "LINE Login required";
  return;
}

const profile = await liff.getProfile();

const params = new URLSearchParams(window.location.search);
const consultId = params.get("consultId");

status.textContent =
  "LINE authentication successful | NCM: " +
  profile.displayName +
  " | Consult ID: " +
  (consultId || "ไม่พบ Consult ID");
        const idToken = liff.getIDToken();

if (!idToken) {
  throw new Error("ไม่พบ LINE ID token");
}

const BACKEND_URL = "https://script.google.com/macros/s/AKfycbweDtqTMk4xpxnr8-4e3MAfCt3xLwKf5RRcXL9-R1h5nk4t4r3nY7xD9gG8eoZUlPBh/exec";

async function fetchWithRetry(url, options, maxAttempts = 3) {
  let lastError;

  for (let attempt = 1; attempt <= maxAttempts; attempt++) {
    try {
      return await fetch(url, options);
    } catch (error) {
      lastError = error;

      if (attempt < maxAttempts) {
        await new Promise(resolve => setTimeout(resolve, 1000));
      }
    }
  }

  throw lastError;
}

const backendResponse = await fetchWithRetry(BACKEND_URL, {
  method: "POST",
  headers: {
    "Content-Type": "text/plain;charset=utf-8"
  },
  body: JSON.stringify({
    action: "verifyNCM",
    idToken: idToken,
    consultId: consultId
  })
});
const result = await backendResponse.json();

if (!result.success) {
  throw new Error(result.error || "Backend verification failed");
}
if (!result.authorized) {
  throw new Error("คุณไม่มีสิทธิ์รับ Consult นี้");
}

const ackButton = document.getElementById("ackButton");
const ackStatus = document.getElementById("ackStatus");
const consultDetail = document.getElementById("consultDetail");
const consultContent = document.getElementById("consultContent");
const assessButton = document.getElementById("assessButton");
const assessStatus = document.getElementById("assessStatus");
consultContent.textContent =
  result.consultContent || "ไม่มีรายละเอียดการส่งปรึกษา";

consultDetail.style.display = "block";
// แสดงปุ่มตามสถานะปัจจุบันของ Consult
if (result.isAssessed) {

  // ประเมินเรียบร้อยแล้ว
  ackButton.style.display = "inline-block";
  ackButton.disabled = true;
  ackButton.textContent = "รับ Consult แล้ว";

  assessButton.style.display = "inline-block";
  assessButton.disabled = true;
  assessButton.textContent = "ประเมินผู้ป่วยแล้ว";

  ackStatus.textContent =
    "Consult นี้ถูกรับแล้วโดย " + result.ncmName;

  assessStatus.textContent =
    "ประเมินผู้ป่วยเรียบร้อยแล้ว";

} else if (result.isAcknowledged) {

  // รับ Consult แล้ว แต่ยังไม่ได้ประเมิน
  ackButton.style.display = "inline-block";
  ackButton.disabled = true;
  ackButton.textContent = "รับ Consult แล้ว";

  ackStatus.textContent =
    "Consult นี้ถูกรับแล้วโดย " + result.ncmName;

  assessButton.style.display = "inline-block";
  assessButton.disabled = false;
} else {

  // ยังไม่ได้รับ Consult
  ackButton.style.display = "inline-block";
}
        
ackButton.addEventListener("click", async () => {

  // ป้องกันการกดซ้ำระหว่างกำลังส่งข้อมูล
  ackButton.disabled = true;
  ackButton.textContent = "กำลังรับ Consult...";

  try {

    const currentIdToken = liff.getIDToken();

    if (!currentIdToken) {
      throw new Error("ไม่พบ LINE ID token");
    }

    const ackResponse = await fetch(BACKEND_URL, {
      method: "POST",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify({
        action: "acknowledgeConsult",
        idToken: currentIdToken,
        consultId: consultId
      })
    });

    const ackResult = await ackResponse.json();

    if (!ackResult.success) {
      throw new Error(
        ackResult.error || "ไม่สามารถรับ Consult ได้"
      );
    }

    if (ackResult.alreadyAcknowledged) {

  ackStatus.textContent =
    "Consult นี้ถูกรับแล้วโดย " +
    ackResult.ncmName;

  ackButton.textContent = "รับ Consult แล้ว";

} else {

  ackStatus.textContent =
    "รับ Consult เรียบร้อย โดย " +
    ackResult.ncmName;

  ackButton.textContent = "รับ Consult แล้ว";
}

// เมื่อ Consult ถูกรับแล้ว ให้แสดงปุ่ม Assessment
assessButton.style.display = "inline-block";
assessButton.disabled = false;
} catch (error) {

    ackStatus.textContent =
      "เกิดข้อผิดพลาด: " +
      (error.message || String(error));

    ackButton.disabled = false;
    ackButton.textContent = "รับ Consult";
  }
});   
assessButton.addEventListener("click", async () => {

  // ป้องกันการกดซ้ำระหว่างกำลังส่งข้อมูล
  assessButton.disabled = true;
  assessButton.textContent = "กำลังบันทึก Assessment...";

  try {

    const currentIdToken = liff.getIDToken();

    if (!currentIdToken) {
      throw new Error("ไม่พบ LINE ID token");
    }

    const assessResponse = await fetch(BACKEND_URL, {
      method: "POST",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify({
        action: "assessConsult",
        idToken: currentIdToken,
        consultId: consultId
      })
    });

    const assessResult = await assessResponse.json();

    if (!assessResult.success) {
      throw new Error(
        assessResult.error || "ไม่สามารถบันทึก Assessment ได้"
      );
    }

    if (assessResult.alreadyAssessed) {

      assessStatus.textContent =
        "Consult นี้ได้รับการประเมินแล้วโดย " +
        assessResult.ncmName;

    } else {

      assessStatus.textContent =
        "บันทึกการประเมินเรียบร้อย โดย " +
        assessResult.ncmName;
    }

    assessButton.textContent = "ประเมินผู้ป่วยแล้ว";

  } catch (error) {

    assessStatus.textContent =
      "เกิดข้อผิดพลาด: " +
      (error.message || String(error));

    assessButton.disabled = false;
    assessButton.textContent = "ประเมินผู้ป่วยแล้ว";
  }
});        
status.textContent =
  "Backend verification successful | NCM: " +
  (result.displayName || profile.displayName) +
  " | Consult ID: " +
  (consultId || "ไม่พบ Consult ID");
            } catch (error) {
      status.textContent =
        "LIFF ERROR: " + (error.message || String(error));

      console.error(error);
    }
  }

  initializeLIFF();
</script>

</body>
</html>
